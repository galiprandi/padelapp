name: Auto-enable auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  enable-auto-merge:
    # Only auto-enable for the repo owner (galiprandi).
    # Branch protection required checks (CI + Vercel) still gate the actual merge.
    if: github.event.pull_request.user.login == 'galiprandi'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            mutation($prId: ID!, $mergeMethod: PullRequestMergeMethod!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $prId, mergeMethod: $mergeMethod}) {
                pullRequest { autoMergeRequest { enabledAt } }
              }
            }' \
            -F prId=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} --jq '.node_id') \
            -f mergeMethod=SQUASH
