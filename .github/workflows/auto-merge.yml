name: Auto-enable auto-merge

on:
  pull_request:
    types: [opened, reopened]

jobs:
  enable-auto-merge:
    # Only auto-enable for the repo owner (galiprandi).
    # Branch protection required checks (CI + Vercel) still gate the actual merge.
    # Auto-merge stays enabled across subsequent pushes (synchronize events).
    if: github.event.pull_request.user.login == 'galiprandi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Wait briefly for GitHub to calculate mergeable state on PR open
          sleep 5
          PR_ID=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.node_id')
          gh api graphql -f query='
            mutation($prId: ID!, $mergeMethod: PullRequestMergeMethod!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $prId, mergeMethod: $mergeMethod}) {
                pullRequest { autoMergeRequest { enabledAt } }
              }
            }' \
            -F prId="$PR_ID" \
            -f mergeMethod=SQUASH
